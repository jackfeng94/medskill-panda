name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries the scripts and tests use (PDF, PPTX, DOCX, HTTP)
        run: python -m pip install --quiet pypdf python-pptx python-docx reportlab requests
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  example:
    # Builds the DEMO-HF example (HTML decks, PowerPoint decks, manuscript) with the plugin's own
    # tools and runs every check on them, so a broken engine, builder or linter shows up here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Libraries the example needs
        run: python -m pip install --quiet numpy matplotlib python-docx python-pptx
      - name: Build and check the DEMO-HF example
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: sh examples/demo-hf/check.sh
